<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-dark-title hero-dark-desc">
  <title id="hero-dark-title">Darshil Mangukiya — Turning raw data into reliable decisions</title>
  <desc id="hero-dark-desc">Dark-mode hero banner with a connected data-node network and pipeline motif on a deep navy background</desc>
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFadeDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <pattern id="gridDark" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#3fa9c9" stroke-width="1"/>
    </pattern>
    <mask id="gridMaskDark">
      <rect x="0" y="0" width="1200" height="360" fill="url(#gridFadeDark)"/>
    </mask>
    <linearGradient id="pipeStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bgDark)"/>
  <rect width="1200" height="360" fill="url(#gridDark)" opacity="0.12" mask="url(#gridMaskDark)"/>
  <circle cx="960" cy="90" r="220" fill="url(#glowCyan)"/>
  <circle cx="1040" cy="270" r="200" fill="url(#glowViolet)"/>

  <!-- data-flow node network -->
  <g fill="none" stroke="url(#pipeStroke)" stroke-width="1.4" opacity="0.55">
    <path d="M 700 300 C 770 260, 800 230, 860 210" />
    <path d="M 860 210 C 910 195, 930 150, 985 120" />
    <path d="M 860 210 C 900 235, 940 245, 995 255" />
    <path d="M 985 120 C 1030 100, 1055 70, 1100 55" />
    <path d="M 985 120 C 1015 140, 1045 150, 1090 150" />
    <path d="M 995 255 C 1035 250, 1060 260, 1100 245" />
    <path d="M 995 255 C 1030 285, 1065 300, 1115 300" />
    <path d="M 1090 150 C 1105 175, 1105 195, 1100 245" />
  </g>
  <g fill="none" stroke="url(#pipeStroke)" stroke-width="1.8" stroke-dasharray="4 7" opacity="0.4">
    <path d="M 700 300 C 770 260, 800 230, 860 210" />
    <path d="M 985 120 C 1030 100, 1055 70, 1100 55">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <circle cx="700" cy="300" r="5" fill="#22d3ee"/>
    <circle cx="860" cy="210" r="7" fill="#67e8f9"/>
    <circle cx="985" cy="120" r="6" fill="#a78bfa"/>
    <circle cx="995" cy="255" r="6" fill="#22d3ee"/>
    <circle cx="1090" cy="150" r="7" fill="#c4b5fd"/>
    <circle cx="1100" cy="55" r="5" fill="#67e8f9"/>
    <circle cx="1100" cy="245" r="5" fill="#8b5cf6"/>
    <circle cx="1115" cy="300" r="5" fill="#22d3ee"/>
    <circle cx="985" cy="120" r="11" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="9;15;9" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="210" r="10" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="8;14;8" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text block -->
  <rect x="64" y="96" width="4" height="150" fill="url(#accentBar)" rx="2"/>

  <text x="92" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="0.5" fill="#f1f5f9">
    DARSHIL MANGUKIYA
  </text>

  <text x="93" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#67e8f9">
    Turning raw data into reliable decisions.
  </text>

  <text x="93" y="252" font-family="'JetBrains Mono', SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="3" fill="#8b96ad">
    DATA <tspan fill="#22d3ee">·</tspan> ANALYTICS <tspan fill="#8b5cf6">·</tspan> INTELLIGENCE <tspan fill="#22d3ee">·</tspan> PLATFORMS
  </text>

  <line x1="93" y1="276" x2="620" y2="276" stroke="#1e2a3f" stroke-width="1"/>
  <line x1="93" y1="276" x2="230" y2="276" stroke="url(#pipeStroke)" stroke-width="1.5" opacity="0.8"/>

  <!-- faint bridging thread, ties the text block to the network so the lower-left doesn't read empty -->
  <path d="M 100 315 C 280 300, 480 308, 700 300" fill="none" stroke="url(#pipeStroke)" stroke-width="1" opacity="0.14"/>
  <circle cx="215" cy="308" r="2.5" fill="#22d3ee" opacity="0.28"/>
  <circle cx="420" cy="304" r="2" fill="#8b5cf6" opacity="0.22"/>
</svg>
